name: plastid-prod

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: plastid-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-plastid_cms}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host 5433 → container 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-plastid_cms}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: plastid-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_password}
    volumes:
      - minio_data_prod:/data
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # MinIO web console
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── MinIO bucket setup ──────────────────────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: plastid-minio-setup-prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_secure_password};
        mc mb --ignore-existing myminio/${S3_BUCKET:-plastid-media};
        mc anonymous set download myminio/${S3_BUCKET:-plastid-media};
        echo 'Bucket ${S3_BUCKET:-plastid-media} ready.';
        exit 0;
      "

  # ── PIA React Frontend (Prod) ───────────────────────────────────────────────
  pia-react:
    container_name: pia-react-prod
    build:
      context: ./pia-react
      dockerfile: Dockerfile.prod
    expose:
      - "5173"
    networks:
      - default
      - web-network
    restart: always

  # ── Sun Real Estate Frontend (Prod) ─────────────────────────────────────────
  sun-re:
    container_name: sun-re-prod
    build:
      context: ./sun-re
      dockerfile: Dockerfile.prod
    expose:
      - "5174"
    networks:
      - default
      - web-network
    restart: always

volumes:
  postgres_data_prod:
    driver: local
  minio_data_prod:
    driver: local

networks:
  default:
  web-network:
    external: true
