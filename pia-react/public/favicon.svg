<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent background — Only the house design in brand gold -->
  <g fill="none" stroke="#C49B5D" stroke-linecap="round" stroke-linejoin="round">
    <!-- Floor Line -->
    <path d="M 30,460 H 482" stroke-width="26"/>

    <!-- Main Architectural House & Roof Structure -->
    <path d="M 85,460 V 220 H 295 M 25,255 L 256,40 L 430,200" stroke-width="28"/>

    <!-- 4-Pane Gold Window -->
    <rect x="216" y="130" width="80" height="80" fill="#C49B5D" stroke="#C49B5D" stroke-width="6" rx="6"/>
    <path d="M 256,130 V 210 M 216,170 H 296" stroke="#ffffff" stroke-width="10"/>

    <!-- Pendant Light Wire & Cone Shade -->
    <path d="M 256,220 V 310 L 235,350 H 277 L 256,310" stroke-width="22"/>
    
    <!-- Filament Bulb -->
    <circle cx="256" cy="370" r="18" fill="#C49B5D" stroke="#C49B5D" stroke-width="4"/>
  </g>
</svg>